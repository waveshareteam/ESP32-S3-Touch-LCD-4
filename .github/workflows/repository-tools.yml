name: Test Repository Tools

on:
  push: {}
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-tools-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show Python version
        run: python3 --version
      - name: Verify immutable firmware artifacts
        run: python3 scripts/verify_firmware_artifacts.py --repo . --manifest firmware/artifacts.json --index
      - name: Run repository tool tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
