name: Build Examples

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "all, an example name, or a repo-relative example path"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: examples-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      idf_matrix: ${{ steps.route.outputs.idf_matrix }}
      arduino_matrix: ${{ steps.route.outputs.arduino_matrix }}
      idf_count: ${{ steps.route.outputs.idf_count }}
      arduino_count: ${{ steps.route.outputs.arduino_count }}
      docs_only: ${{ steps.route.outputs.docs_only }}
      firmware_touched: ${{ steps.route.outputs.firmware_touched }}
      release_review_required: ${{ steps.route.outputs.release_review_required }}
      route_summary: ${{ steps.route.outputs.route_summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ github.event.inputs.target }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/route_ci.py --selector "${TARGET:-all}" --github-output "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
            python3 scripts/route_ci.py --base "$base" --head HEAD --github-output "$GITHUB_OUTPUT"
          else
            if [[ "$BEFORE" =~ ^0+$ ]]; then
              python3 scripts/route_ci.py --selector all --github-output "$GITHUB_OUTPUT"
            else
              python3 scripts/route_ci.py --base "$BEFORE" --head HEAD --github-output "$GITHUB_OUTPUT"
            fi
          fi
      - name: Report routing decision
        run: |
          echo "${{ steps.route.outputs.route_summary }}"
          echo "firmware_touched=${{ steps.route.outputs.firmware_touched }}"
          echo "release_review_required=${{ steps.route.outputs.release_review_required }}"

  build-esp-idf:
    needs: route
    if: needs.route.outputs.idf_count != '0'
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.idf_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build ${{ matrix.path }} with ESP-IDF ${{ matrix.idf }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          idf.py -C "${{ matrix.path }}" -B "build/${{ matrix.name }}-${{ matrix.idf }}" set-target esp32s3 build
      - name: Package firmware
        shell: bash
        run: |
          python3 releases/package_firmware.py --framework esp-idf --project "${{ matrix.path }}" --build-dir "build/${{ matrix.name }}-${{ matrix.idf }}" --name "ESP32-S3-Touch-LCD-4-${{ matrix.name }}-${{ matrix.idf }}" --framework-version "${{ matrix.idf }}" --target esp32s3 --git-sha "${{ github.event.pull_request.head.sha || github.sha }}" --output-dir release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp-idf-${{ matrix.name }}-${{ matrix.idf }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  build-arduino:
    needs: route
    if: needs.route.outputs.arduino_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.route.outputs.arduino_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
      - name: Compile ${{ matrix.path }}
        run: |
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" --libraries examples/arduino/libraries --export-binaries --output-dir "build/${{ matrix.name }}-${{ matrix.core }}" "${{ matrix.path }}"
      - name: Package firmware
        run: |
          python3 releases/package_firmware.py --framework arduino --project "${{ matrix.path }}" --build-dir "build/${{ matrix.name }}-${{ matrix.core }}" --name "ESP32-S3-Touch-LCD-4-${{ matrix.name }}-arduino-${{ matrix.core }}" --framework-version "${{ matrix.core }}" --target esp32s3 --git-sha "${{ github.event.pull_request.head.sha || github.sha }}" --output-dir release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-arduino-${{ matrix.name }}-${{ matrix.core }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  ci-status:
    if: always()
    needs: [route, build-esp-idf, build-arduino]
    runs-on: ubuntu-latest
    steps:
      - name: Require routing and non-skipped builds to succeed
        env:
          ROUTE: ${{ needs.route.result }}
          IDF: ${{ needs.build-esp-idf.result }}
          ARDUINO: ${{ needs.build-arduino.result }}
          SUMMARY: ${{ needs.route.outputs.route_summary }}
        run: |
          echo "$SUMMARY"
          if [[ "$ROUTE" != success || ( "$IDF" != success && "$IDF" != skipped ) || ( "$ARDUINO" != success && "$ARDUINO" != skipped ) ]]; then
            exit 1
          fi
