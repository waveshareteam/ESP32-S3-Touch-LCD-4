name: Arduino examples

on:
  pull_request:
    paths:
      - "examples/Arduino-v3.3.2/**"
      - "docs/CI.md"
      - "docs/CI_CN.md"
      - "examples/README.md"
      - "examples/README_CN.md"
      - "README.md"
      - "README_CN.md"
      - ".github/workflows/arduino-examples.yml"
      - ".github/scripts/discover_arduino_examples.py"
  push:
    branches:
      - main
    paths:
      - "examples/Arduino-v3.3.2/**"
      - "docs/CI.md"
      - "docs/CI_CN.md"
      - "examples/README.md"
      - "examples/README_CN.md"
      - "README.md"
      - "README_CN.md"
      - ".github/workflows/arduino-examples.yml"
      - ".github/scripts/discover_arduino_examples.py"
  workflow_dispatch:
    inputs:
      sketch:
        description: "Arduino sketch directory name, path, or all"
        required: false
        default: "all"

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: 1.5.0
  ARDUINO_ESP32_CORE_VERSION: 3.3.10
  ARDUINO_BOARD_PACKAGE_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  ARDUINO_FQBN: esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB
  ARDUINO_LIBRARIES: examples/Arduino-v3.3.2/libraries

jobs:
  discover:
    name: Discover sketches
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sketches.outputs.matrix }}
      has_sketches: ${{ steps.sketches.outputs.has_sketches }}
      sketches: ${{ steps.sketches.outputs.sketches }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover changed Arduino sketches
        id: sketches
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python .github/scripts/discover_arduino_examples.py \
              --sketch "${{ inputs.sketch }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python .github/scripts/discover_arduino_examples.py \
              --base-ref "${{ github.event.pull_request.base.sha }}" \
              --head-ref "${{ github.event.pull_request.head.sha }}" \
              --fallback-all
          else
            before="${{ github.event.before }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              before=""
            fi
            python .github/scripts/discover_arduino_examples.py \
              --base-ref "$before" \
              --head-ref "${{ github.sha }}" \
              --fallback-all
          fi

      - name: Summary
        shell: bash
        run: |
          if [[ "${{ steps.sketches.outputs.has_sketches }}" == "true" ]]; then
            {
              echo "### Arduino sketches selected"
              echo
              echo '${{ steps.sketches.outputs.sketches }}' | tr ',' '\n' | sed '/^$/d' | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Arduino sketch changes detected." >> "$GITHUB_STEP_SUMMARY"
          fi

  compile:
    name: Compile ${{ matrix.sketch }} (Arduino ESP32 3.3.10)
    needs: discover
    if: needs.discover.outputs.has_sketches == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sketch: ${{ fromJson(needs.discover.outputs.matrix).sketch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: arduino-${{ runner.os }}-cli-${{ env.ARDUINO_CLI_VERSION }}-esp32-${{ env.ARDUINO_ESP32_CORE_VERSION }}

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index --additional-urls "$ARDUINO_BOARD_PACKAGE_URL"
          arduino-cli core install "esp32:esp32@$ARDUINO_ESP32_CORE_VERSION" --additional-urls "$ARDUINO_BOARD_PACKAGE_URL"
          arduino-cli version
          arduino-cli core list

      - name: Compile sketch
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn "$ARDUINO_FQBN" \
            --libraries "$ARDUINO_LIBRARIES" \
            "${{ matrix.sketch }}"
